<svg width="1180" height="220" viewBox="0 0 1180 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1180" y2="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020617"/>
      <stop offset="0.52" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="1180" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="16" result="blur"/><feBlend in="SourceGraphic" in2="blur"/></filter>
    <style>
      .mono{font-family:JetBrains Mono,Consolas,monospace}
      .sans{font-family:Inter,Segoe UI,Arial,sans-serif}
      .pill{fill:#0b1220;stroke:#334155;stroke-width:1.2}
      .label{fill:#e2e8f0;font-size:23px;font-weight:650}
      .muted{fill:#94a3b8;font-size:20px}
    </style>
  </defs>

  <rect x="2" y="2" width="1176" height="216" rx="30" fill="url(#card)"/>
  <rect x="2" y="2" width="1176" height="216" rx="30" stroke="url(#stroke)" stroke-width="2" opacity="0.75"/>
  <rect x="50" y="44" width="8" height="132" rx="4" fill="url(#stroke)" filter="url(#glow)"/>

  <text x="88" y="70" class="mono" fill="#22d3ee" font-size="20">STACK</text>
  <text x="88" y="108" class="sans" fill="#ffffff" font-size="34" font-weight="800" letter-spacing="-0.7">clean tools for real products</text>
  <text x="88" y="145" class="mono muted">frontend · backend · data · automation</text>

  <g transform="translate(560 50)">
    <rect class="pill" x="0" y="0" width="126" height="46" rx="23"/><text class="sans label" x="28" y="31">Next.js</text>
    <rect class="pill" x="142" y="0" width="154" height="46" rx="23"/><text class="sans label" x="168" y="31">TypeScript</text>
    <rect class="pill" x="312" y="0" width="122" height="46" rx="23"/><text class="sans label" x="340" y="31">Python</text>
    <rect class="pill" x="450" y="0" width="160" height="46" rx="23"/><text class="sans label" x="476" y="31">PostgreSQL</text>

    <rect class="pill" x="0" y="66" width="132" height="46" rx="23"/><text class="sans label" x="28" y="97">Supabase</text>
    <rect class="pill" x="148" y="66" width="104" height="46" rx="23"/><text class="sans label" x="179" y="97">React</text>
    <rect class="pill" x="268" y="66" width="128" height="46" rx="23"/><text class="sans label" x="296" y="97">Node.js</text>
    <rect class="pill" x="412" y="66" width="198" height="46" rx="23"/><text class="sans label" x="438" y="97">Automation</text>
  </g>
</svg>
