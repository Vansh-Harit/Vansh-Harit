<svg width="154" height="44" viewBox="0 0 154 44" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">LinkedIn</title><desc id="desc">LinkedIn link with React Bits inspired electric border</desc>
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="154" y2="44" gradientUnits="userSpaceOnUse"><stop stop-color="#0A66C2"/><stop offset=".52" stop-color="#a855f7"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <filter id="electric" x="-20%" y="-60%" width="140%" height="220%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025 0.18" numOctaves="3" seed="7" result="noise"><animate attributeName="baseFrequency" dur="1.35s" values="0.025 0.18;0.045 0.12;0.025 0.18" repeatCount="indefinite"/></feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.8" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="1.7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-150%" width="160%" height="400%"><feGaussianBlur stdDeviation="4"/></filter>
    <style>
      .font{font-family:Inter,Segoe UI,Arial,sans-serif}
      .electric{stroke:url(#edge);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:42 14 5 18;animation:travel 2.2s linear infinite;filter:url(#electric)}
      @keyframes travel{to{stroke-dashoffset:-158}}
      @media (prefers-reduced-motion:reduce){.electric{animation:none}}
    </style>
  </defs>
  <rect x="5" y="5" width="144" height="34" rx="17" fill="#070a12" stroke="url(#edge)" opacity=".22" filter="url(#soft)"/>
  <rect x="4" y="4" width="146" height="36" rx="18" fill="#070a12" stroke="#273044"/>
  <rect class="electric" x="4" y="4" width="146" height="36" rx="18" fill="none"/>
  <text x="38" y="28" font-size="18" font-weight="900" fill="#0A66C2" class="font" text-anchor="middle">in</text>
  <text x="86" y="27.5" font-size="14" font-weight="800" fill="#f8fafc" class="font" text-anchor="middle">LinkedIn</text>
</svg>
