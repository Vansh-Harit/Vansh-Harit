<svg width="1400" height="420" viewBox="0 0 1400 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020617"/>
      <stop offset="0.45" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(250 90) rotate(53) scale(380 300)">
      <stop stop-color="#22d3ee" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1120 330) rotate(140) scale(420 320)">
      <stop stop-color="#a855f7" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="260" y1="0" x2="1080" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
    <style>
      @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
      @keyframes dash { to { stroke-dashoffset: -700; } }
      @keyframes pulse { 0%,100%{opacity:.35} 50%{opacity:.9} }
      .chip{fill:#0f172a;stroke:#334155;stroke-width:1.3}
      .chipText{fill:#cbd5e1;font-family:Inter,Segoe UI,Arial,sans-serif;font-size:22px;font-weight:650}
      .mono{font-family:JetBrains Mono,Consolas,monospace}
      .float{animation:float 6s ease-in-out infinite; transform-origin:center;}
      .line{stroke-dasharray:18 18; animation:dash 18s linear infinite;}
      .pulse{animation:pulse 3s ease-in-out infinite;}
    </style>
  </defs>

  <rect width="1400" height="420" rx="34" fill="url(#bg)"/>
  <rect width="1400" height="420" rx="34" fill="url(#glow1)"/>
  <rect width="1400" height="420" rx="34" fill="url(#glow2)"/>

  <g opacity="0.26">
    <path class="line" d="M50 350 C240 210 370 310 520 170 S850 120 990 250 1220 300 1350 170" stroke="url(#accent)" stroke-width="3" fill="none"/>
    <path class="line" d="M80 105 C260 190 360 70 520 145 S800 250 990 105 1210 80 1320 245" stroke="#22d3ee" stroke-width="2" fill="none" opacity=".55"/>
  </g>

  <g opacity="0.18">
    <circle cx="108" cy="70" r="3" fill="#e2e8f0"/>
    <circle cx="220" cy="330" r="4" fill="#22d3ee"/>
    <circle cx="1185" cy="90" r="4" fill="#a855f7"/>
    <circle cx="1312" cy="315" r="3" fill="#34d399"/>
    <circle cx="680" cy="55" r="3" fill="#e2e8f0"/>
    <circle cx="780" cy="355" r="4" fill="#22d3ee"/>
  </g>

  <g class="float">
    <rect x="1040" y="82" width="220" height="130" rx="22" fill="#020617" fill-opacity=".72" stroke="#334155"/>
    <text x="1064" y="122" fill="#22d3ee" class="mono" font-size="20">const builder =</text>
    <text x="1064" y="154" fill="#cbd5e1" class="mono" font-size="20">{ products,</text>
    <text x="1064" y="184" fill="#cbd5e1" class="mono" font-size="20">  systems, ai }</text>
  </g>

  <g filter="url(#blur)" opacity="0.45">
    <circle cx="205" cy="202" r="80" fill="#22d3ee"/>
    <circle cx="1190" cy="292" r="90" fill="#8b5cf6"/>
  </g>

  <text x="110" y="135" fill="#94a3b8" class="mono" font-size="24">FULL-STACK • AI SYSTEMS • PRODUCT ENGINEERING</text>
  <text x="110" y="210" fill="white" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="72" font-weight="850" letter-spacing="-2">Vansh Harit</text>
  <rect x="110" y="235" width="650" height="6" rx="3" fill="url(#accent)"/>
  <text x="110" y="295" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="600">Building Contestic, Inbox Unite &amp; useful systems</text>

  <g transform="translate(110 330)">
    <rect class="chip" width="138" height="46" rx="23"/><text class="chipText" x="24" y="31">Next.js</text>
    <g transform="translate(154 0)"><rect class="chip" width="154" height="46" rx="23"/><text class="chipText" x="24" y="31">TypeScript</text></g>
    <g transform="translate(324 0)"><rect class="chip" width="128" height="46" rx="23"/><text class="chipText" x="24" y="31">Python</text></g>
    <g transform="translate(468 0)"><rect class="chip" width="154" height="46" rx="23"/><text class="chipText" x="24" y="31">Postgres</text></g>
    <g transform="translate(638 0)"><rect class="chip" width="190" height="46" rx="23"/><text class="chipText" x="24" y="31">Automation</text></g>
  </g>

  <g class="pulse" opacity="0.7">
    <circle cx="1010" cy="303" r="7" fill="#34d399"/>
    <text x="1030" y="311" fill="#bbf7d0" class="mono" font-size="22">currently building</text>
  </g>
</svg>
