name: Update profile stats (disabled)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    # Disabled because this workflow counts only public authored commits,
    # not the authenticated rolling contribution total used by the profile.
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Refresh stats SVG
        env:
          PROFILE_USERNAME: Vansh-Harit
        run: python3 .github/scripts/update_aura_stats.py

      - name: Commit updated stats
        run: |
          if git diff --quiet -- assets/aura-stats.svg; then
            echo "Stats are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/aura-stats.svg
          git commit -m "chore: update profile stats"
          git push
