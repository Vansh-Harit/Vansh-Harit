name: Update profile stats

on:
  schedule:
    # 09:17 Asia/Kolkata (03:47 UTC)
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    paths-ignore:
      - "assets/aura-stats.svg"

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Refresh stats SVG
        env:
          PROFILE_USERNAME: Vansh-Harit
        run: python3 .github/scripts/update_aura_stats.py

      - name: Commit updated stats
        run: |
          if git diff --quiet -- assets/aura-stats.svg; then
            echo "Stats are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/aura-stats.svg
          git commit -m "chore: update profile stats"
          git push
